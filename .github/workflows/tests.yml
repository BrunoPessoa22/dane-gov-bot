name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['public/**', 'state/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: black --check . && isort --check-only .
      - run: pytest -q
